name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # An empty database for the migration check.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forma
          POSTGRES_PASSWORD: forma
          POSTGRES_DB: forma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forma -d forma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Queues and rate limits, for the integration tests.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Typecheck and tests import the generated Prisma client.
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Migrations apply to an empty database and match schema.prisma
        env:
          DATABASE_URL: postgresql://forma:forma@localhost:5432/forma
        run: |
          npx prisma migrate deploy
          # Exit code 2 means schema.prisma changed without a migration.
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Integration tests against Postgres and Redis
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://forma:forma@localhost:5432/forma
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-integration-tests-only-not-a-real-secret
          LOG_LEVEL: silent
        run: npm run test:integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Also type-checks.
      - run: npm run build

  stack:
    name: Docker stack and browser tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      FORMA_API_IMAGE: forma-api:ci
      FORMA_WEB_IMAGE: forma-web:ci
      # The production stack plus the test override (Postgres published for
      # the browser tests' setup, rate limits raised).
      COMPOSE_FILE: docker-compose.prod.yaml:docker-compose.e2e.yaml
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          tags: ${{ env.FORMA_API_IMAGE }}
          load: true
          build-args: APP_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          tags: ${{ env.FORMA_WEB_IMAGE }}
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Start the stack
        run: |
          db_password="$(openssl rand -hex 16)"
          echo "::add-mask::$db_password"
          echo "E2E_DB_PASSWORD=$db_password" >> "$GITHUB_ENV"
          {
            echo "PUBLIC_URL=http://localhost:8080"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$db_password"
          } > .env.production
          docker compose --env-file .env.production up -d --no-build --wait --wait-timeout 180
      - name: Smoke test
        run: deploy/smoke-test.sh http://localhost:8080
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: e2e/pom.xml
      - name: Browser tests (Selenium + Cucumber, headless Chrome)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_DB_URL: jdbc:postgresql://localhost:55432/forma
        run: ./mvnw -B test
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            e2e/target/cucumber-report.html
            e2e/target/failures/
          if-no-files-found: ignore
      - name: Logs
        if: failure()
        run: docker compose --env-file .env.production logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env.production down -v
