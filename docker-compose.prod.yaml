# The full stack on one host: reverse proxy, frontend, API, worker, Postgres
# and Redis.
#
#   cp .env.production.example .env.production   # then fill it in
#   docker compose --env-file .env.production -f docker-compose.prod.yaml up -d --build
#
# The app is then on http://localhost:8080 (or https://$SITE_ADDRESS).
# For local development use docker-compose.yaml, which runs only Postgres and
# Redis for the apps you start yourself.

# Distinct from the dev stack (docker-compose.yaml gets the folder name,
# "forma"), so the two never share containers or database volumes.
name: forma-prod

x-backend: &backend
  image: ${FORMA_API_IMAGE:-forma-api:local}
  build:
    context: ./backend
    args:
      APP_RELEASE: ${APP_RELEASE:-}
  restart: unless-stopped
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER:-forma}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forma}
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    PUBLIC_API_URL: ${PUBLIC_URL:?set PUBLIC_URL}
    FRONTEND_URL: ${PUBLIC_URL}
    CORS_ORIGINS: ${PUBLIC_URL}
    # Caddy is the one hop in front of the API.
    TRUST_PROXY: "1"
    LOG_LEVEL: ${LOG_LEVEL:-info}
    STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    UPLOAD_DIR: /app/uploads
    S3_BUCKET: ${S3_BUCKET:-}
    S3_REGION: ${S3_REGION:-}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
    RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
    RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    EMAIL_FROM: ${EMAIL_FROM:-}
    SENTRY_DSN: ${SENTRY_DSN:-}

services:
  # Applies pending migrations, then exits. The API and worker wait for it.
  migrate:
    <<: *backend
    command: ["npm", "run", "migrate:deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Longer than the 15s drain in shutdown.ts, so it finishes before SIGKILL.
    stop_grace_period: 20s

  worker:
    <<: *backend
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 20s

  web:
    image: ${FORMA_WEB_IMAGE:-forma-web:local}
    build:
      context: ./frontend
      args:
        # Browser error reporting is baked into the bundle at build time.
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_WEB_DSN:-${SENTRY_DSN:-}}
    restart: unless-stopped
    environment:
      # Errors in the Next.js server itself, read at run time.
      SENTRY_DSN: ${SENTRY_WEB_DSN:-${SENTRY_DSN:-}}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-forma}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Queued jobs live here: persist them, and never evict one to free memory.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  uploads:
  caddy_data:
  caddy_config:
